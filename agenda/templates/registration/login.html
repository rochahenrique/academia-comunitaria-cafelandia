{% extends "agenda/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {{ form.as_p }}
  <button type="submit">Entrar</button>
</form>
<p>Ainda não tem conta? <a href="{% url 'agenda:cadastro' %}">Cadastre seu grupo</a>.</p>
{% endblock %}
